name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[docs]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python mari-kit-landing/tools/generate_algorithm_inventory.py --check
      - run: sphinx-build -W --keep-going -b html mari-kit-landing/docs mari-kit-landing/_build/html
      - run: python mari-kit-landing/tools/check_sidebar.py --site-dir mari-kit-landing/_build/html

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,examples]'
      - run: ruff format --check src tests examples
      - run: ruff check src tests examples
      - run: pyright src
      - run: pytest -q
      - run: python -m examples.verify_all

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/mari-wheel-check
      - run: /tmp/mari-wheel-check/bin/pip install dist/*.whl
      - run: /tmp/mari-wheel-check/bin/python -c "import mari_kit"

  algorithm-solvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,algorithm-solvers]'
      - run: pytest -q tests/test_algorithm_*.py
      - run: python -m examples.algorithm_choices_demo --solvers
