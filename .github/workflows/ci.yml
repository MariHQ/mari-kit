name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[docs]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python mari-kit-landing/tools/generate_algorithm_inventory.py --check
      - run: sphinx-build -W --keep-going -b html mari-kit-landing/docs mari-kit-landing/_build/html
      - run: python mari-kit-landing/tools/check_sidebar.py --site-dir mari-kit-landing/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: mari-kit-landing/_build/html
          include-hidden-files: false

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,examples]'
      - run: ruff format --check src tests examples
      - run: ruff check src tests examples
      - run: pyright src
      - run: pytest -q
      - run: python -m examples.verify_all
      - run: python -m examples.company_brains
      - run: python -m examples.company_brains.durable

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/mari-wheel-check
      - run: /tmp/mari-wheel-check/bin/pip install dist/*.whl
      - run: /tmp/mari-wheel-check/bin/python -c "import mari_kit"

  algorithm-solvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,algorithm-solvers]'
      - run: pytest -q tests/test_algorithm_*.py
      - run: python -m examples.algorithm_choices_demo --solvers

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, test]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: kit.mari.guru
      CLOUDFRONT_DISTRIBUTION_ID: E8QTOGCJZ27MT
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::386318010728:role/mari-kit-deploy
          aws-region: us-east-1
      - run: >-
          aws s3 sync site "s3://${S3_BUCKET}" --delete
          --exclude ".doctrees/*" --exclude ".buildinfo"
          --cache-control "public,max-age=300"
      - run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
