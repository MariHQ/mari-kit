[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mari-core"
version = "0.1.0.dev0"
description = "Dependency-free values and protocols for product knowledge systems"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
