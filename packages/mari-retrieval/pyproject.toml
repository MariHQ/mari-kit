[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mari-retrieval"
version = "0.1.0.dev0"
description = "MUVERA and PolarQuant retrieval primitives"
requires-python = ">=3.11"
dependencies = ["mari-core==0.1.0.dev0", "numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
